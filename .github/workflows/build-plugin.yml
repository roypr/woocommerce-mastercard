name: Build Plugin ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on greenpack branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin greenpack --depth=50 --no-tags
          if ! git branch -r --contains "${{ github.sha }}" | grep -q "origin/greenpack"; then
            echo "Tag ${{ github.ref_name }} is not on origin/greenpack. Aborting."
            exit 1
          fi

      - name: Setup PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install dependencies (no dev)
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Set build vars
        id: vars
        run: |
          SLUG="woocommerce-mastercard"
          VERSION="${GITHUB_REF_NAME:-dev}"
          echo "slug=$SLUG"                   >> $GITHUB_OUTPUT
          echo "version=$VERSION"             >> $GITHUB_OUTPUT
          echo "zip=${SLUG}-${VERSION}.zip"   >> $GITHUB_OUTPUT

      - name: Assemble plugin folder
        run: |
          mkdir -p /tmp/build/${{ steps.vars.outputs.slug }}
          rsync -a . /tmp/build/${{ steps.vars.outputs.slug }}/ \
            --exclude='.git'            \
            --exclude='.github'         \
            --exclude='node_modules'    \
            --exclude='tests'           \
            --exclude='.env'            \
            --exclude='.env.*'          \
            --exclude='*.md'            \
            --exclude='phpunit*'        \
            --exclude='composer.json'   \
            --exclude='composer.lock'   \
            --exclude='.gitignore'      \
            --exclude='*.test.php'      \
            --exclude='Makefile'

      - name: Create ZIP
        run: |
          cd /tmp/build
          zip -r "${{ steps.vars.outputs.zip }}" "${{ steps.vars.outputs.slug }}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.zip }}
          path: /tmp/build/${{ steps.vars.outputs.zip }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/build/${{ steps.vars.outputs.zip }}