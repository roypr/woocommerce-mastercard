name: Build Plugin

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Verify tag is on greenpack branch
        run: |
          git fetch origin greenpack --no-tags
          if ! git branch -r --contains "${{ github.sha }}" | grep -q "origin/greenpack"; then
            echo "Tag is not on origin/greenpack. Aborting."
            exit 1
          fi

      - name: Build plugin
        run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/*.zip